  <title>StreamFetch — Conversor e Downloader de Vídeos</title>
  <style>
    :root {
      --bg-body: #020617;
      --bg-card: #0f172a;
      --bg-input: #020617;
      --bg-btn-sec: #1e293b;
      --bg-btn-sec-hover: #334155;
      --border-color: #1e293b;
      --border-light: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #4f46e5;
      --primary-hover: #6366f1;
      --primary-light: #818cf8;
      --success: #059669;
      --success-hover: #10b981;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --danger-border: rgba(239, 68, 68, 0.3);
      --danger-text: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      line-height: 1.5;
    }

    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; width: 20px; height: 20px; }

    header {
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 20px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo span { color: var(--primary-light); }

    nav { display: flex; gap: 24px; }
    nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    nav button:hover { color: var(--text-main); }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .hero-container { width: 100%; max-width: 680px; text-align: center; }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background-color: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: var(--primary-light);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    @media (min-width: 640px) { h1 { font-size: 2.85rem; } }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto 32px auto;
    }

    .search-box {
      background-color: var(--bg-card);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 640px) { .search-box { flex-direction: row; } }

    .input-wrapper {
      position: relative;
      flex-grow: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 14px 85px 14px 16px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-paste {
      position: absolute;
      right: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      background-color: var(--bg-btn-sec);
      color: #cbd5e1;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-analyze {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-analyze:hover { background-color: var(--primary-hover); }

    .error-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      word-break: break-word;
    }

    .result-card {
      margin-top: 32px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
    }

    .result-top { display: flex; flex-direction: column; gap: 20px; }
    @media (min-width: 640px) { .result-top { flex-direction: row; } }

    .thumb-box {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--bg-btn-sec);
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
    }

    @media (min-width: 640px) { .thumb-box { width: 210px; } }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .source-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-light);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .video-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .controls-grid { grid-template-columns: 1fr 1fr; } }

    .control-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .format-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: var(--bg-input);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 6px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-active { background-color: var(--primary); color: white; }
    .tab-inactive { background-color: transparent; color: var(--text-muted); }

    select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.825rem;
      border-radius: 8px;
      padding: 8px 10px;
      outline: none;
    }

    .action-area {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .btn-convert {
      width: 100%;
      background-color: var(--success);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-convert:hover { background-color: var(--success-hover); }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      background-color: var(--bg-input);
      border-radius: 999px;
      height: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .progress-fill {
      background-color: var(--primary-hover);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .ready-actions { display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 640px) { .ready-actions { flex-direction: row; } }

    .btn-download-again {
      flex-grow: 1;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-reset {
      padding: 14px 20px;
      border-radius: 12px;
      background-color: var(--bg-btn-sec);
      color: #cbd5e1;
      border: none;
      font-size: 0.875rem;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 20px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {

		background-color: var(--bg-card);
border: 1px solid var(--border-color);
border-radius: 16px;
max-width: 440px;
width: 100%;
padding: 24px;
}

const API_URL = window.location.origin;
let currentFormat = 'mp4';
let currentVideoData = null;
let lastDownloadedBlobUrl = null;
let lastDownloadedFilename = '';
const qualityOptions = {
mp4: [
{ label: '1080p Full HD (.mp4)', value: '1080p' },
{ label: '720p HD (.mp4)', value: '720p' },
{ label: '480p SD (.mp4)', value: '480p' }
],
mp3: [
{ label: '320 kbps Alta Qualidade (.mp3)', value: '320k' },
{ label: '128 kbps Padrão (.mp3)', value: '128k' }
]
};
async function pasteFromClipboard() {
try {
const text = await navigator.clipboard.readText();
document.getElementById('url-input').value = text;
} catch (err) {
alert('Cole manualmente com Ctrl+V ou toque e segure no campo.');
}
}
function detectSource(url) {
if (/youtube.com|youtu.be/i.test(url)) return 'YouTube';
if (/instagram.com) return 'Instagram';
if (/tiktok.com) return 'TikTok';
if (/vimeo.com) return 'Vimeo';
return null;
}
async function analyzeUrl() {
const input = document.getElementById('url-input').value.trim();
const errorBox = document.getElementById('error-box');
const resultCard = document.getElementById('result-card');
const btnText = document.getElementById('btn-analyze-text');
const btnSpinner = document.getElementById('btn-analyze-spinner');
errorBox.classList.add('hidden');
resultCard.classList.add('hidden');
let validUrl = false;
try { new URL(input); validUrl = true; } catch (_) {}
const source = detectSource(input);
if (!validUrl || !source) {
document.getElementById('error-message').textContent =
'URL inválida ou plataforma não suportada. Use links do YouTube, Instagram, TikTok ou Vimeo.';
errorBox.classList.remove('hidden');
return;
}
btnText.textContent = 'Analisando...';
btnSpinner.classList.remove('hidden');
try {
const response = await fetch(${API_URL}/analyze, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ url: input })
});
if (!response.ok) {
const errData = await response.json().catch(() => ({}));
throw new Error(errData.detail || Erro HTTP ${response.status});
}
const data = await response.json();
currentVideoData = {
url: input,
title: data.title,
duration: data.duration,
source: data.source || source,
thumbnail: data.thumbnail
};
const fallbackThumb = "data:image/svg+xml;utf8,";
const thumbImg = document.getElementById('video-thumb');
thumbImg.onerror = function() { this.src = fallbackThumb; };
thumbImg.src = currentVideoData.thumbnail || fallbackThumb;
document.getElementById('video-title').textContent = currentVideoData.title;
document.getElementById('video-duration').textContent = currentVideoData.duration;
document.getElementById('video-source').textContent = currentVideoData.source;
selectFormat('mp4');
document.getElementById('btn-convert').classList.remove('hidden');
document.getElementById('progress-container').classList.add('hidden');
document.getElementById('download-ready').classList.add('hidden');
resultCard.classList.remove('hidden');
} catch (err) {
document.getElementById('error-message').textContent = err.message;
errorBox.classList.remove('hidden');
} finally {
btnText.textContent = 'Analisar';
btnSpinner.classList.add('hidden');
}
}
function selectFormat(format) {
currentFormat = format;
const tabMp4 = document.getElementById('tab-mp4');
const tabMp3 = document.getElementById('tab-mp3');
const select = document.getElementById('quality-select');
if (format === 'mp4') {
tabMp4.className = 'tab-btn tab-active';
tabMp3.className = 'tab-btn tab-inactive';
} else {
tabMp3.className = 'tab-btn tab-active';
tabMp4.className = 'tab-btn tab-inactive';
}
select.innerHTML = '';
qualityOptions[format].forEach(opt => {
const option = document.createElement('option');
option.value = opt.value;
option.textContent = opt.label;
select.appendChild(option);
});
}
async function startConversion() {
const btnConvert = document.getElementById('btn-convert');
const progressContainer = document.getElementById('progress-container');
const progressBar = document.getElementById('progress-bar');
const progressPercent = document.getElementById('progress-percent');
const progressStatus = document.getElementById('progress-status');
const downloadReady = document.getElementById('download-ready');
const quality = document.getElementById('quality-select').value;
btnConvert.classList.add('hidden');
progressContainer.classList.remove('hidden');
progressBar.style.width = '40%';
progressPercent.textContent = 'Processando...';
progressStatus.textContent = Baixando e convertendo para ${currentFormat.toUpperCase()}...;
try {
const response = await fetch(${API_URL}/download, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
url: currentVideoData.url,
format: currentFormat,
quality: quality
})
});
if (!response.ok) {
const errData = await response.json().catch(() => ({}));
throw new Error(errData.detail || 'Erro na conversão do vídeo.');
}
progressBar.style.width = '90%';
progressStatus.textContent = 'Recebendo arquivo...';
const blob = await response.blob();
lastDownloadedBlobUrl = URL.createObjectURL(blob);
const disposition = response.headers.get('Content-Disposition');
lastDownloadedFilename = StreamFetch_${quality}.${currentFormat};
if (disposition && disposition.includes('filename=')) {
lastDownloadedFilename = disposition.split('filename=')[1].replace(/"/g, '');
}
progressBar.style.width = '100%';
progressPercent.textContent = '100%';
setTimeout(() => {
progressContainer.classList.add('hidden');
downloadReady.classList.remove('hidden');
triggerRealDownload();
}, 300);
} catch (err) {
progressContainer.classList.add('hidden');
btnConvert.classList.remove('hidden');
document.getElementById('error-message').textContent = err.message;
document.getElementById('error-box').classList.remove('hidden');
}
}
function triggerRealDownload() {
if (!lastDownloadedBlobUrl) return;
const link = document.createElement('a');
link.href = lastDownloadedBlobUrl;
link.download = lastDownloadedFilename;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
function resetApp() {
document.getElementById('url-input').value = '';
document.getElementById('result-card').classList.add('hidden');
document.getElementById('error-box').classList.add('hidden');
document.getElementById('progress-bar').style.width = '0%';
}
function toggleModal(id) {
document.getElementById(id).classList.toggle('hidden');
}
